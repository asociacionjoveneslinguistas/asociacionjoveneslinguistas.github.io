<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>{{ .Page.Title }} / {{ site.Title }}</title>
{{- $to := printf "%s%s" .Permalink (cond (isset .Page.Params "ancla_alias") (printf "#%s" .Page.Params.ancla_alias) "") }}
<link rel="canonical" href="{{ .Permalink }}">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url={{ $to }}">
</head>
<body><a href="{{ $to }}">{{ .Page.Title }}</a></body>
</html>
